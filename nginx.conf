server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Por trás de TLS (CDN/load balancer), Location absoluto saía como http://…
    # e o Google marcava as URLs do sitemap como "Página com redirecionamento".
    absolute_redirect off;
    port_in_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=*" always;

    # Canônico = sem barra final (igual ao sitemap / PUBLIC_PAGE_SEO).
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location ~* \.php$ {
        return 404;
    }

    # Painel autenticado: app.html (CSS/JS só do app, sem marketing).
    location /empresa {
        try_files $uri /app.html;
    }
    location /funcionario {
        try_files $uri /app.html;
    }

    # Admin não existe neste domínio.
    location /admin {
        return 404;
    }

    # URL inexistente → HTTP 404 de verdade (não servir a home; isso gerava reload infinito no MPA).
    error_page 404 /404/index.html;

    location / {
        # Prerender gera pastas (sobre/index.html). NÃO use `$uri/` sozinho.
        # Sem fallback para /index.html: path sem HTML = 404.
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css text/markdown application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Espelhos markdown (llms.txt) — servidos, mas fora do sitemap e sem indexação.
    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
